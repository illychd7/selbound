[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "selbound"
version = "0.1.0"
description = "Response-adjusted selection bounds for single-cell perturbation data"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Illych Alvarez", email = "ialvarez@espol.edu.ec"}]
requires-python = ">=3.9"
dependencies = ["numpy>=1.22", "scipy>=1.8", "pandas>=1.4", "scikit-learn>=1.1"]
keywords = ["single-cell", "drug tolerance", "persister cells", "selection", "max-divergence", "lineage tracing"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
anndata = ["anndata>=0.8"]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/illychd7/selbound"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
